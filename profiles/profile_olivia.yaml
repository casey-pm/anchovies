job_summary: |
  Maintain project documentation, specs, and team communications (part-time 20hrs/week).
  Create/enforce documentation standards, write user guides and training materials.
  Take meeting notes, distribute action items, update status boards, prepare exec reports.

  Key Skills: Technical writing (Confluence, Notion, Markdown),
  project tracking (Jira, Asana), Git basics (for documentation repos),
  presentation materials (Google Slides), information architecture

